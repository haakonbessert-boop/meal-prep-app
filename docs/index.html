<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meal Prep">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0}img{max-width:100%}</style>
<title>Meal Prep</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: ruhige Spalte wie der Chat in der Claude-App, Wochen-Liste als Seitenmenü, Ansichten als Umschalter oben. */
:root{
  --bg:#faf9f5; --sidebar:#f3f1ea; --surface:#ffffff; --ink:#141413; --ink-2:#3d3d3a; --muted:#73726c;
  --line:#e6e3d9; --hover:#efede5; --accent:#c6613f; --accent-fill:#d97757; --accent-soft:#f6e6dd; --on-accent:#ffffff;
  --ok:#5b7a3a; --warn:#b5651d; --scrim:rgba(20,20,19,.32);
  --serif:"Geist", -apple-system, system-ui, sans-serif;
  --sans:"Geist", -apple-system, system-ui, sans-serif;
  --mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px; --r-sm:9px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#262624; --sidebar:#1f1e1d; --surface:#30302e; --ink:#faf9f5; --ink-2:#e5e3da; --muted:#a6a39a;
  --line:#3e3e3a; --hover:#383835; --accent:#e08a6c; --accent-fill:#d97757; --accent-soft:#41302a; --on-accent:#1f1e1d;
  --ok:#9bbd72; --warn:#e5a663; --scrim:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#262624; --sidebar:#1f1e1d; --surface:#30302e; --ink:#faf9f5; --ink-2:#e5e3da; --muted:#a6a39a;
  --line:#3e3e3a; --hover:#383835; --accent:#e08a6c; --accent-fill:#d97757; --accent-soft:#41302a; --on-accent:#1f1e1d;
  --ok:#9bbd72; --warn:#e5a663; --scrim:rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
.hello{font-weight:600!important;letter-spacing:-.02em!important}
.meal h2,.h-sec,.section h3,.drawer-head h2{font-weight:600!important;letter-spacing:-.01em}
/* Häkchen rund wie in der Claude-App */
.item input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:1.5px solid var(--muted);border-radius:50%;display:grid;place-items:center;cursor:pointer;background:var(--surface)}
.item input:checked{background:var(--accent-fill);border-color:var(--accent-fill)}
.item input:checked::after{content:"";width:6px;height:11px;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.progress{height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent-fill);transition:width .2s}
.stepno{font:500 .8rem var(--mono);color:var(--muted);min-width:1.4em;padding-top:2px}
.item.done .stepno{color:var(--muted)}
html,body{background:var(--bg)}
body{color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
.num,.qty,table td{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent-fill);outline-offset:2px}

/* Kopfleiste */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:620px;margin:0 auto;padding-block:8px 10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:10px}
.bar{display:flex;align-items:center;gap:8px;min-width:0}
.icon-btn{width:38px;height:38px;flex:none;display:grid;place-items:center;border:none;background:none;border-radius:var(--r-sm);cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{background:var(--hover)}
.week-btn{flex:1;min-width:0;text-align:left;border:none;background:none;padding:4px 6px;border-radius:var(--r-sm);cursor:pointer;display:grid}
.week-btn:hover{background:var(--hover)}
.week-btn b{font:600 1rem/1.25 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week-btn span{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kw{font:500 .78rem var(--mono);color:var(--muted);white-space:nowrap}
.switch{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:3px;background:var(--sidebar);border:1px solid var(--line);border-radius:12px}
.switch button{border:none;background:none;padding:7px 2px;border-radius:9px;font-size:.88rem;color:var(--muted);cursor:pointer}
.switch button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* Seitenmenü */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(320px,86vw);background:var(--sidebar);border-right:1px solid var(--line);z-index:21;display:flex;flex-direction:column;gap:4px;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:10px;overflow-y:auto}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px 8px}
.drawer-head h2{font:500 1.25rem var(--serif);margin:0}
.d-label{font-size:.75rem;color:var(--muted);padding:12px 10px 4px;font-weight:500}
.d-item{border:none;background:none;text-align:left;padding:9px 10px;border-radius:var(--r-sm);cursor:pointer;display:grid;gap:1px}
.d-item:hover{background:var(--hover)}
.d-item[aria-current="true"]{background:var(--hover)}
.d-item b{font-weight:500;font-size:.95rem}
.d-item span{font-size:.8rem;color:var(--muted)}
.free{display:grid;gap:8px;padding:6px 10px}
.free label{display:grid;gap:4px;font-size:.8rem;color:var(--muted)}
select{font:.95rem var(--sans);padding:9px 10px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .2s ease-out}.scrim{animation:fade .2s}}
@keyframes slide{from{transform:translateX(-100%)}}
@keyframes fade{from{opacity:0}}

/* Inhalt */
.wrap{max-width:620px;margin:0 auto;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
h1,h2,h3{text-wrap:balance;margin:0}
.hello{font:400 clamp(1.6rem,6vw,2rem)/1.2 var(--serif);letter-spacing:-.01em;color:var(--ink)}
.hello em{font-style:normal;color:var(--accent)}
.lead{color:var(--muted);margin:6px 0 0;font-size:.95rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.meal{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 16px;border-top:1px solid var(--line)}
.meal:first-child{border-top:none}
.meal > div{min-width:0}
.meal-label{font-size:.78rem;color:var(--muted)}
.meal h2{font:500 1.12rem/1.3 var(--serif);margin-top:1px}
.meal .macro{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;font:400 .86rem var(--mono);color:var(--ink-2)}
.macro .p{color:var(--accent);font-weight:500}
.count{font:500 1.05rem var(--mono);color:var(--ink-2);text-align:right;white-space:nowrap}
.count small{display:block;font:.72rem var(--sans);color:var(--muted)}
.copy{margin-left:auto;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:3px 9px;font:500 .78rem var(--sans);color:var(--ink-2);cursor:pointer}
.copy:hover{background:var(--hover)}
.h-sec{font:500 1.05rem var(--serif);margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:right;padding:10px 14px;border-top:1px solid var(--line)}
thead th{border-top:none;font:500 .75rem var(--sans);color:var(--muted)}
th:first-child,td:first-child{text-align:left;font-family:var(--sans)}
.st{display:inline-flex;align-items:center;gap:6px;font:.8rem var(--sans);color:var(--muted);white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.st.warn::before{background:var(--warn)}
.note{font-size:.84rem;color:var(--muted);margin:0}
.ver{text-align:center;font:.75rem var(--mono);color:var(--muted);padding:0 16px calc(24px + env(safe-area-inset-bottom,0px))}

/* Einkauf, Prep, Rezepte (Grundstil, Feinschliff folgt) */
.section{display:grid;gap:12px}
.section > .bar{justify-content:space-between;flex-wrap:wrap}
.section h3{font:500 1.05rem var(--serif)}
.reset{border:none;background:none;color:var(--accent);font-size:.88rem;cursor:pointer;padding:4px 0}
.group{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.eyebrow{font-size:.75rem;color:var(--muted);font-weight:500;padding:10px 14px 4px}
.item{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
.eyebrow + .item{border-top:none}
.item input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent-fill);flex:none}
.item .what{flex:1;min-width:0}
.item .qty{font-size:.88rem;white-space:nowrap;color:var(--ink-2)}
.item .need{display:block;font-size:.78rem;color:var(--muted)}
.item.done .what,.item.done .qty{text-decoration:line-through;color:var(--muted)}
details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
summary{cursor:pointer;font-weight:500}
details[open] summary{margin-bottom:8px}
ul.plain{margin:0;padding-left:1.2em;display:grid;gap:4px}
.macros{display:flex;gap:12px;flex-wrap:wrap;font:.86rem var(--mono)}
.chip.p{color:var(--accent)}
.ing{display:grid;grid-template-columns:1fr auto auto;gap:3px 14px;font-size:.9rem}
.ing span:nth-child(3n+2),.ing span:nth-child(3n){text-align:right;font-family:var(--mono);font-size:.84rem}
.ing .h{font:500 .72rem var(--sans)!important;color:var(--muted)}
.switch.two{grid-template-columns:repeat(2,1fr)}
.days td{vertical-align:top}
.days td small{display:block;font:.78rem var(--sans);color:var(--muted);white-space:normal}
.cost{display:flex;justify-content:space-between;font:500 .9rem var(--mono);padding:12px 14px;border-top:1px solid var(--line)}
</style>

</head>
<body>
<header class="top"><div class="top-in">
  <div class="bar">
    <div class="week-btn" style="cursor:default"><b>Reis-Plan</b><span>Einkauf und Kochen Mo und Do</span></div>
    <span class="kw" id="kw"></span>
  </div>
  <div class="switch" role="tablist" aria-label="Ansicht">
    <button role="tab" data-tab="woche">Woche</button>
    <button role="tab" data-tab="einkauf">Einkauf</button>
    <button role="tab" data-tab="prep">Prep</button>
    <button role="tab" data-tab="rezepte">Rezepte</button>
  </div>
</div></header>

<main class="wrap" id="view"></main>

"name": "Passierte Tomaten", "abteilung": "Konserven & Trocken", "packung": {"einheit": "Packung 500 g", "menge": 500}, "naehrwerte": {"basis": "100 g", "kcal": 32, "protein": 1.4, "fett": 0.2, "kh": 5, "ballaststoffe": 1}, "preis": 0.69}, "paprika": {"name": "Paprika", "abteilung": "Obst & Gemüse", "packung": {"einheit": "3er-Pack", "menge": 450}, "naehrwerte": {"basis": "100 g", "kcal": 30, "protein": 1, "fett": 0.3, "kh": 5, "ballaststoffe": 2}, "preis": 1.99}, "zwiebel": {"name": "Zwiebel", "abteilung": "Obst & Gemüse", "packung": {"einheit": "Stück", "menge": 150}, "naehrwerte": {"basis": "100 g", "kcal": 33, "protein": 1.2, "fett": 0.2, "kh": 6, "ballaststoffe": 1.5}, "preis": 0.25}, "reis": {"name": "Reis (Langkorn oder Basmati)", "abteilung": "Konserven & Trocken", "packung": {"einheit": "Packung 1 kg", "menge": 1000}, "naehrwerte": {"basis": "100 g", "kcal": 350, "protein": 7, "fett": 0.6, "kh": 78, "ballaststoffe": 1.4}, "preis": 1.79, "vorrat": true}, "linsen": {"name": "Rote Linsen", "abteilung": "Konserven & Trocken", "packung": {"einheit": "Packung 500 g", "menge": 500}, "naehrwerte": {"basis": "100 g", "kcal": 340, "protein": 24, "fett": 1.5, "kh": 50, "ballaststoffe": 11}, "preis": 1.49, "vorrat": true}, "rapsoel": {"name": "Rapsöl", "abteilung": "Konserven & Trocken", "packung": {"einheit": "Flasche 1 l", "menge": 920}, "naehrwerte": {"basis": "100 g", "kcal": 884, "protein": 0, "fett": 100, "kh": 0, "ballaststoffe": 0}, "preis": 1.99, "vorrat": true}, "leinsamen": {"name": "Leinsamen geschrotet", "abteilung": "Konserven & Trocken", "packung": {"einheit": "Packung 500 g", "menge": 500}, "naehrwerte": {"basis": "100 g", "kcal": 534, "protein": 18, "fett": 42, "kh": 1.6, "ballaststoffe": 27}, "preis": 1.29, "vorrat": true}, "erdnussmus": {"name": "Erdnussmus", "abteilung": "Konserven & Trocken", "packung": {"einheit": "Glas", "menge": 350}, "naehrwerte": {"basis": "100 g", "kcal": 600, "protein": 25, "fett": 49, "kh": 12, "ballaststoffe": 7}, "preis": 2.99, "vorrat": true}, "soja": {"name": "Sojasauce", "abteilung": "Konserven & Trocken", "packung": {"einheit": "Flasche", "menge": 250}, "naehrwerte": {"basis": "100 g", "kcal": 60, "protein": 8, "fett": 0, "kh": 5, "ballaststoffe": 0}, "preis": 1.49, "vorrat": true}, "tomatenmark": {"name": "Tomatenmark (Tube)", "abteilung": "Konserven & Trocken", "packung": {"einheit": "Tube 200 g", "menge": 200}, "naehrwerte": {"basis": "100 g", "kcal": 80, "protein": 4.5, "fett": 0.5, "kh": 13, "ballaststoffe": 3}, "preis": 0.99, "vorrat": true}, "knoblauch": {"name": "Knoblauch", "abteilung": "Obst & Gemüse", "packung": {"einheit": "Knolle", "menge": 10}, "naehrwerte": {"basis": "Zehe", "kcal": 0, "protein": 0, "fett": 0, "kh": 0, "ballaststoffe": 0}, "preis": 0.49, "vorrat": true}, "gewuerze": {"name": "Gewürze (Chili, Paprika, Kreuzkümmel, Curry, Zimt, Jodsalz, Pfeffer)", "abteilung": "Konserven & Trocken", "packung": {"einheit": "Glas", "menge": 1}, "naehrwerte": {"basis": "100 g", "kcal": 0, "protein": 0, "fett": 0, "kh": 0, "ballaststoffe": 0}, "vorrat": true}};

const byId = Object.fromEntries(REZ.rezepte.map(r => [r.id, r]));
const sessById = Object.fromEntries(REZ.sessions.map(s => [s.id, s]));
const ABT = ["Kühltheke", "Obst & Gemüse", "Tiefkühl", "Konserven & Trocken"];

const store = {
  get(k, d){ try { const v = localStorage.getItem("mp." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem("mp." + k, JSON.stringify(v)); } catch {} }
};
const fmt = n => n.toLocaleString("de-DE");
const eur = n => n.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
const kw = d => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y) / 864e5 + 1) / 7); };
const heuteSess = () => { const d = new Date().getDay(); return d >= 1 && d <= 3 ? "mo" : "do"; };

let state = Object.assign({ tab: "woche" }, store.get("reis", {}));
if (!["woche", "einkauf", "prep", "rezepte"].includes(state.tab)) state.tab = "woche";
let sess = heuteSess();
const save = () => store.set("reis", { tab: state.tab });
// Häkchen gelten pro Kalenderwoche, nächste Woche startet die Liste leer.
const key = s => `kw${kw(new Date())}:${s}`;

// Makros pro Portion aus den Nährwerten
function makros(r){
  const m = { kcal: 0, protein: 0, fett: 0, kh: 0 };
  for (const [k, g] of r.zutaten){ const n = ZUT[k].naehrwerte; if (n.basis !== "100 g") continue;
    for (const f of Object.keys(m)) m[f] += n[f] * g / 100; }
  return { kcal: Math.round(m.kcal), protein: Math.round(m.protein), fett: Math.round(m.fett), kh: Math.round(m.kh) };
}
const M = Object.fromEntries(REZ.rezepte.map(r => [r.id, makros(r)]));
// Quark-Soße gehört zu jeder Hähnchen-Box (A und C)
const tagSum = t => [t.mittag, t.abend].flatMap(id => ["A", "C"].includes(id) ? [id, "Q1"] : [id]).reduce((a, id) => { const m = M[id]; for (const f in a) a[f] += m[f]; return a; }, { kcal: 0, protein: 0, fett: 0, kh: 0 });

function einkauf(sid){
  const tot = {};
  for (const id of sessById[sid].rezepte){ const r = byId[id];
    for (const [k, m] of r.zutaten) tot[k] = (tot[k] || 0) + m * r.portionen; }
  const out = {}, vorrat = [];
  let summe = 0;
  for (const [k, m] of Object.entries(tot)){
    const z = ZUT[k];
    if (z.vorrat){ vorrat.push(z.name); continue; }
    const n = Math.max(1, Math.ceil(m / z.packung.menge - 0.08));
    summe += n * (z.preis || 0);
    const einh = z.packung.einheit;
    const qty = einh === "Stück" ? `${n} Stück` : n === 1 ? einh : `${n} × ${einh}`;
    const fuer = REZ.rezepte.filter(r => sessById[sid].rezepte.includes(r.id) && r.zutaten.some(([kk]) => kk === k)).map(r => r.kurz.startsWith("Quark") ? "Quark" : r.kurz).join(", ");
    (out[z.abteilung] ||= []).push({ k, name: z.name, qty, need: `für ${fuer}`, preis: z.preis ? n * z.preis : 0 });
  }
  return { out, vorrat: [...new Set(vorrat)], summe };
}

const sessSwitch = () => `<div class="switch two" role="tablist" aria-label="Einkaufstag">${REZ.sessions.map(s => `<button role="tab" data-sess="${s.id}" aria-selected="${s.id === sess}">${s.name}</button>`).join("")}</div>`;
const chips = m => `<div class="macros"><span class="chip">${fmt(m.kcal)} kcal</span><span class="chip p">${m.protein} g Protein</span><span class="chip">${m.fett} g Fett</span><span class="chip">${m.kh} g KH</span></div>`;

function mealRow(r, when){
  const m = M[r.id];
  const txt = `${r.name}: ${m.kcal} kcal, ${m.protein} g Protein, ${m.fett} g Fett, ${m.kh} g KH`;
  return `<div class="meal">
    <div><div class="meal-label">${when}</div><h2>${r.name}</h2></div>
    <div class="count">× ${r.portionen}<small>Boxen</small></div>
    <div class="macro"><span>${fmt(m.kcal)} kcal</span><span class="p">${m.protein} g Protein</span><span>${m.fett} g Fett</span><button class="copy" data-copy="${txt}">Kopieren</button></div>
  </div>`;
}

function viewWoche(){
  const z = REZ.ziele, heute = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"][new Date().getDay()];
  const sums = REZ.tage.map(tagSum);
  const woche = sums.reduce((a, s) => a + s.kcal, 0), pAvg = Math.round(sums.reduce((a, s) => a + s.protein, 0) / 7);
  const st = (v, goal, isP) => isP
    ? (v >= goal ? `<span class="st">Ziel erreicht</span>` : `<span class="st warn">${goal - v} g fehlen</span>`)
    : (Math.abs(v - goal) <= 50 ? `<span class="st">passt</span>` : v < goal ? `<span class="st">${fmt(goal - v)} übrig</span>` : `<span class="st warn">${fmt(v - goal)} drüber</span>`);
  const t = REZ.tage.find(x => x.tag === heute);
  return `
    <div><h1 class="hello">Heute: <em>${byId[t.mittag].kurz}</em> und <em>${byId[t.abend].kurz}</em>.</h1>
    <p class="lead">15 Uhr und ca. 18:30 je eine Box, zum Hähnchen Quark-Soße. Montag und Donnerstag kaufst du ein und kochst.</p></div>
    <section class="panel">
      ${mealRow(byId.A, "Montag gekocht · Mo–Do, 15 Uhr")}
      ${mealRow(byId.B, "Montag gekocht · Mo–Mi, abends")}
      ${mealRow(byId.C, "Donnerstag gekocht · Do–So, abends")}
      ${mealRow(byId.D, "Donnerstag gekocht · Fr–So, 15 Uhr")}
      ${mealRow({ ...byId.Q1, portionen: 8 }, "Zu jeder Hähnchen-Box (Mo–Do mittags, Do–So abends)")}
    </section>
    <section>
      <h3 class="h-sec">Tage gegen dein Ziel</h3>
      <div class="panel" style="overflow-x:auto"><table class="days">
        <thead><tr><th>Tag</th><th>kcal</th><th>Protein</th></tr></thead>
        <tbody>${REZ.tage.map((x, i) => `<tr${x.tag === heute ? ' style="background:var(--accent-soft)"' : ""}><td>${x.tag}<small>${byId[x.mittag].kurz} · ${byId[x.abend].kurz}</small></td><td>${fmt(sums[i].kcal)}<br>${st(sums[i].kcal, z.kcal_tag)}</td><td>${sums[i].protein} g<br>${st(sums[i].protein, z.protein_tag, true)}</td></tr>`).join("")}</tbody>
      </table></div>
    </section>
    <p class="note">Woche: ${fmt(woche)} kcal von ${fmt(z.kcal_woche)}, im Schnitt ${pAvg} g Protein pro Tag (Ziel ${z.protein_tag} g). Werte aus Standard-Nährwerten, in der Tracking-App die Etiketten nehmen.</p>`;
}

function viewEinkauf(){
  const s = sessById[sess], { out, vorrat, summe } = einkauf(sess);
  const checks = store.get("checks:" + key(sess), {});
  const all = Object.values(out).flat(), done = all.filter(i => checks[i.k]).length;
  let h = `<div class="section">${sessSwitch()}<p class="note">${s.name} ${s.wann}, reicht für ${s.deckt}.</p>
    <div class="bar"><h3>${done} von ${all.length} im Wagen</h3><button class="reset" id="reset">Zurücksetzen</button></div><div class="progress"><span style="width:${all.length ? done / all.length * 100 : 0}%"></span></div>`;
  for (const a of ABT){
    if (!out[a]) continue;
    h += `<div class="group"><span class="eyebrow">${a}</span>`;
    for (const i of out[a]) h += `<label class="item ${checks[i.k] ? "done" : ""}"><input type="checkbox" data-k="${i.k}" ${checks[i.k] ? "checked" : ""}><span class="what">${i.name}<span class="need">${i.need}</span></span><span class="qty">${i.qty}</span></label>`;
    h += `</div>`;
  }
  const andere = einkauf(sess === "mo" ? "do" : "mo").summe;
  h += `<div class="group"><div class="cost"><span>ca. ${s.name}</span><span>${eur(summe)}</span></div><div class="cost"><span>ca. Woche (ohne Vorrat)</span><span>${eur(summe + andere)}</span></div></div>
  <details><summary>Vorrat prüfen (${vorrat.length})</summary><ul class="plain">${vorrat.map(v => `<li>${v}</li>`).join("")}</ul></details>
  <p class="note">Ganze Packungen: Frisches und TK sind bis Sonntag aufgebraucht, übrig bleibt nur Vorrat. Preise sind Schätzungen für Kaufland-Eigenmarke.</p></div>`;
  return h;
}

function viewPrep(){
  const s = sessById[sess], checks = store.get("prep:" + key(sess), {});
  return `<div class="section">${sessSwitch()}
    <div class="bar"><h3>${s.name} ${s.wann} · ca. ${s.minuten} min</h3><button class="reset" id="resetPrep">Zurücksetzen</button></div>
    <div class="group">${s.prep.map((x, i) => `<label class="item ${checks[i] ? "done" : ""}"><input type="checkbox" data-p="${i}" ${checks[i] ? "checked" : ""}><span class="stepno">${i + 1}</span><span class="what">${x}</span></label>`).join("")}</div>
    <details open><summary>Haltbarkeit und Tipps</summary><ul class="plain">${REZ.regeln.map(x => `<li>${x}</li>`).join("")}</ul></details>
  </div>`;
}

function ingList(r){
  const rows = r.zutaten.filter(([k, m]) => m > 0).map(([k, m]) => {
    const unit = k === "knoblauch" ? " Zehe" : " g", rd = v => k === "knoblauch" ? Math.round(v * 10) / 10 : Math.round(v);
    return `<span>${ZUT[k].name}</span><span>${fmt(rd(m))}${unit}</span><span>${fmt(rd(m * r.portionen))}${unit}</span>`;
  }).join("");
  return `<div class="ing"><span class="h">Zutat</span><span class="h">Box</span><span class="h">× ${r.portionen}</span>${rows}</div>`;
}
function viewRezepte(){
  return `<div class="section">${REZ.rezepte.filter(r => r.id !== "Q2").map(r => `<details><summary>${r.name}</summary><div class="section">${chips(M[r.id])}${ingList(r)}<p class="note">${r.hinweis}</p></div></details>`).join("")}</div>`;
}

function render(){
  document.getElementById("kw").textContent = `KW ${kw(new Date())}`;
  document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === state.tab));
  document.getElementById("view").innerHTML = { woche: viewWoche, einkauf: viewEinkauf, prep: viewPrep, rezepte: viewRezepte }[state.tab]();
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab]");
  if (t){ state.tab = t.dataset.tab; save(); render(); window.scrollTo(0, 0); return; }
  const sb = e.target.closest("[data-sess]");
  if (sb){ sess = sb.dataset.sess; render(); return; }
  const c = e.target.closest("[data-copy]");
  if (c){ const txt = c.dataset.copy; const ok = () => { c.textContent = "Kopiert"; setTimeout(() => c.textContent = "Kopieren", 1500); };
    try { navigator.clipboard.writeText(txt).then(ok, () => { c.textContent = txt; }); } catch { c.textContent = txt; } return; }
  if (e.target.id === "reset"){ store.set("checks:" + key(sess), {}); render(); }
  if (e.target.id === "resetPrep"){ store.set("prep:" + key(sess), {}); render(); }
});
document.addEventListener("change", e => {
  const d = e.target.dataset || {};
  const k = d.k ?? d.p;
  if (k === undefined) return;
  const bucket = (d.k !== undefined ? "checks:" : "prep:") + key(sess);
  const s = store.get(bucket, {}); s[k] = e.target.checked; store.set(bucket, s);
  e.target.closest(".item").classList.toggle("done", e.target.checked);
  if (state.tab === "einkauf") render();
});
render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script></body>
